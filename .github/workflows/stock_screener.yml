name: Daily Stock Screener

on:
  schedule:
    # 매일 오후 4시 30분 KST = 07:30 UTC
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: '조회할 날짜 (예: 20260814). 비워두면 가장 최근 영업일로 자동 실행됩니다.'
        required: false
        type: string

jobs:
  screen_and_upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas firebase-admin requests beautifulsoup4 lxml
        
    - name: Run Screener
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        TARGET_DATE: ${{ github.event.inputs.target_date }}
      run: |
        python scripts/screener_quant_advanced.py
