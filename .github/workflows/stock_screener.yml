name: Daily Stock Screener

on:
  schedule:
    # 매일 오후 10시 00분 KST = 13:00 UTC
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: '조회할 날짜 (예: 20260814). 비워두면 가장 최근 영업일로 자동 실행됩니다.'
        required: false
        type: string

jobs:
  screen_and_upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas firebase-admin requests beautifulsoup4 lxml finance-datareader
        
    - name: Run Screener with Auto-Retry
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        TARGET_DATE: ${{ github.event.inputs.target_date }}
      run: |
        n=0
        max_attempts=3
        until [ "$n" -ge "$max_attempts" ]
        do
           echo "Attempt $((n+1)) of $max_attempts..."
           python scripts/screener_quant_advanced.py && break
           n=$((n+1))
           if [ "$n" -lt "$max_attempts" ]; then
             echo "실행 실패. 3분(180초) 후 다시 시도합니다..."
             sleep 180
           else
             echo "최대 재시도 횟수($max_attempts) 초과. 업데이트 실패."
             exit 1
           fi
        done
